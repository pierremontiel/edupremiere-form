<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edupremiere — Commencez votre parcours</title>
<style>
  :root {
    --navy: #364169;
    --teal: #369196;
    --mint: rgba(54, 145, 150, 0.12);
    --white: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--mint) 0%, #ffffff 40%);
    color: var(--navy);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--white);
    max-width: 480px;
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(54, 65, 105, 0.12);
    overflow: hidden;
  }
  .header {
    background: var(--navy);
    color: var(--white);
    padding: 32px 28px 24px;
    text-align: center;
  }
  .logo-img {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    margin-bottom: 14px;
    display: block;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .header h1 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header p {
    margin: 0;
    font-size: 14px;
    color: #cfd6e8;
  }
  .body { padding: 28px; }
  .field { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    padding: 11px 12px;
    border: 1.5px solid #dfe3ee;
    border-radius: 8px;
    font-size: 15px;
    color: var(--navy);
    background: #fafbfd;
    transition: border-color 0.15s ease;
    font-family: inherit;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--teal);
    background: var(--white);
  }
  .phone-row {
    display: flex;
    border: 1.5px solid #dfe3ee;
    border-radius: 8px;
    background: #fafbfd;
    overflow: hidden;
  }
  .phone-row:focus-within { border-color: var(--teal); background: var(--white); }
  .phone-row select {
    flex: 0 0 100px;
    border: none;
    border-right: 1.5px solid #dfe3ee;
    border-radius: 0;
    background: transparent;
  }
  .phone-row input {
    flex: 1;
    border: none;
    border-radius: 0;
    background: transparent;
  }
  .phone-row select:focus, .phone-row input:focus { outline: none; }
  .required { color: var(--teal); }
  button {
    width: 100%;
    background: var(--teal);
    color: var(--white);
    border: none;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .success, .error {
    display: none;
    text-align: center;
    padding: 40px 28px;
  }
  .success h2 { color: var(--navy); margin-bottom: 10px; }
  .success p, .error p { color: #5a6480; font-size: 14px; line-height: 1.5; }
  .checkmark {
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--mint); color: var(--teal);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; margin: 0 auto 16px;
  }
  .error { color: #b23b3b; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <img src="logo.jpg" alt="Edupremiere" class="logo-img">
    <div style="font-size:12px; letter-spacing:3px; color:#9aa4c4; font-weight:700; margin-bottom:10px;">EDUPREMIERE</div>
    <h1 data-i18n="title">Commencez votre parcours vers la Malaisie</h1>
    <p data-i18n="subtitle">En 30 secondes</p>
    <a href="#" id="langToggle" style="display:inline-block; margin-top:10px; font-size:12px; color:#cfd6e8; text-decoration:underline;"></a>
  </div>

  <div class="body" id="formWrap">
    <form id="intakeForm">
      <div class="field">
        <label data-i18n="fullName">Nom et Prénom <span class="required">*</span></label>
        <input type="text" name="fullName" required autocomplete="name" data-i18n-placeholder="fullNamePh" placeholder="Entrez votre nom complet">
      </div>

      <div class="field">
        <label data-i18n="phone">Numéro de téléphone <span class="required">*</span></label>
        <div class="phone-row">
          <select name="countryCode" required>
            <option value="+221">🇸🇳 +221</option>
            <option value="+225">🇨🇮 +225</option>
            <option value="+223">🇲🇱 +223</option>
            <option value="+224">🇬🇳 +224</option>
            <option value="+227">🇳🇪 +227</option>
            <option value="+241">🇬🇦 +241</option>
            <option value="+237">🇨🇲 +237</option>
            <option value="+226">🇧🇫 +226</option>
            <option value="+228">🇹🇬 +228</option>
            <option value="+229">🇧🇯 +229</option>
            <option value="+212">🇲🇦 +212</option>
            <option value="+213">🇩🇿 +213</option>
            <option value="+216">🇹🇳 +216</option>
            <option value="+33">🇫🇷 +33</option>
            <option value="+60">🇲🇾 +60</option>
            <option value="+254">🇰🇪 +254</option>
            <option value="+971">🇦🇪 +971</option>
            <option value="+966">🇸🇦 +966</option>
            <option value="+974">🇶🇦 +974</option>
            <option value="+965">🇰🇼 +965</option>
            <option value="+968">🇴🇲 +968</option>
            <option value="+973">🇧🇭 +973</option>
            <option value="+962">🇯🇴 +962</option>
            <option value="+961">🇱🇧 +961</option>
            <option value="+20">🇪🇬 +20</option>
            <option value="+964">🇮🇶 +964</option>
            <option value="+967">🇾🇪 +967</option>
            <option value="+other" data-i18n="other">🌍 Autre</option>
          </select>
          <input type="tel" name="phone" required placeholder="77 123 45 67" autocomplete="tel">
        </div>
      </div>

      <div class="field">
        <label data-i18n="email">Email <span class="required">*</span></label>
        <input type="email" name="email" required autocomplete="email" placeholder="votre@email.com">
      </div>

      <div class="field">
        <label data-i18n="nationality">Nationalité <span class="required">*</span></label>
        <select name="nationality" required>
          <option value="" disabled selected></option>
          <option value="Sénégal" data-i18n="Sénégal">Sénégal</option>
          <option value="Côte d'Ivoire" data-i18n="Côte d'Ivoire">Côte d'Ivoire</option>
          <option value="Mali" data-i18n="Mali">Mali</option>
          <option value="Guinée" data-i18n="Guinée">Guinée</option>
          <option value="Niger" data-i18n="Niger">Niger</option>
          <option value="Gabon" data-i18n="Gabon">Gabon</option>
          <option value="Cameroun" data-i18n="Cameroun">Cameroun</option>
          <option value="Burkina Faso" data-i18n="Burkina Faso">Burkina Faso</option>
          <option value="Togo" data-i18n="Togo">Togo</option>
          <option value="Bénin" data-i18n="Bénin">Bénin</option>
          <option value="Maroc" data-i18n="Maroc">Maroc</option>
          <option value="Algérie" data-i18n="Algérie">Algérie</option>
          <option value="Tunisie" data-i18n="Tunisie">Tunisie</option>
          <option value="Kenya" data-i18n="Kenya">Kenya</option>
          <option value="Émirats Arabes Unis" data-i18n="Émirats Arabes Unis">Émirats Arabes Unis</option>
          <option value="Arabie Saoudite" data-i18n="Arabie Saoudite">Arabie Saoudite</option>
          <option value="Qatar" data-i18n="Qatar">Qatar</option>
          <option value="Koweït" data-i18n="Koweït">Koweït</option>
          <option value="Oman" data-i18n="Oman">Oman</option>
          <option value="Bahreïn" data-i18n="Bahreïn">Bahreïn</option>
          <option value="Jordanie" data-i18n="Jordanie">Jordanie</option>
          <option value="Liban" data-i18n="Liban">Liban</option>
          <option value="Égypte" data-i18n="Égypte">Égypte</option>
          <option value="Irak" data-i18n="Irak">Irak</option>
          <option value="Yémen" data-i18n="Yémen">Yémen</option>
          <option value="Autre" data-i18n="Autre">Autre</option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="school">Établissement actuel <span class="required">*</span></label>
        <input type="text" name="school" required data-i18n-placeholder="schoolPh" placeholder="Lycée ou université — Ex: Lycée Seydina Limamoulaye, UCAD...">
      </div>

      <div class="field">
        <label data-i18n="level">Niveau d'étude souhaitée en Malaisie <span class="required">*</span></label>
        <select name="level" required>
          <option value="" disabled selected></option>
          <option value="Foundation (Prépa)" data-i18n="Foundation (Prépa)">Foundation (Prépa)</option>
          <option value="Diploma (Licence 2)">Diploma (Licence 2)</option>
          <option value="Bachelor (Licence 3)">Bachelor (Licence 3)</option>
          <option value="Master Coursework">Master Coursework</option>
          <option value="Master Research">Master Research</option>
          <option value="PhD (Doctorat)" data-i18n="PhD (Doctorat)">PhD (Doctorat)</option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="program">Nom de la Formation Souhaitée <span class="required">*</span></label>
        <input type="text" name="program" required data-i18n-placeholder="programPh" placeholder="Ex: Informatique, Gestion, Médecine...">
      </div>

      <div class="field">
        <label data-i18n="intake">Rentrée souhaitée <span class="required">*</span></label>
        <div class="phone-row" style="display:grid; grid-template-columns:1fr 1fr;">
          <select name="intakePeriod" required style="border-right:1.5px solid #dfe3ee;">
            <option value="" disabled selected></option>
            <option value="January" data-i18n="January">Janvier</option>
            <option value="February" data-i18n="February">Février</option>
            <option value="March" data-i18n="March">Mars</option>
            <option value="April" data-i18n="April">Avril</option>
            <option value="May" data-i18n="May">Mai</option>
            <option value="June" data-i18n="June">Juin</option>
            <option value="July" data-i18n="July">Juillet</option>
            <option value="August" data-i18n="August">Août</option>
            <option value="September" data-i18n="September">Septembre</option>
            <option value="October" data-i18n="October">Octobre</option>
            <option value="November" data-i18n="November">Novembre</option>
            <option value="December" data-i18n="December">Décembre</option>
          </select>
          <select name="intakeYear" required>
            <option value="" disabled selected></option>
            <option>2026</option>
            <option>2027</option>
            <option>2028</option>
            <option>2029</option>
            <option>2030</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label data-i18n="source">Comment avez-vous entendu parler de nous ? <span class="required">*</span></label>
        <select name="source" required>
          <option value="" disabled selected></option>
          <option value="Referral" data-i18n="Referral">Recommandation (Referral)</option>
          <option value="Social Media" data-i18n="Social Media">Réseaux sociaux</option>
          <option value="Website" data-i18n="Website">Site web</option>
        </select>
      </div>

      <div class="field">
        <label data-i18n="ref">Numéro de parrainage</label>
        <input type="text" name="ref" data-i18n-placeholder="refPh" placeholder="Si applicable">
      </div>

      <button type="submit" id="submitBtn" data-i18n="submit">Envoyer</button>
    </form>
  </div>

  <div class="success" id="successMsg">
    <div class="checkmark">✓</div>
    <h2 data-i18n="thanks">Merci !</h2>
    <p data-i18n="thanksBody">Notre équipe vous contactera sur WhatsApp ou par téléphone sous 24 heures.</p>
  </div>

  <div class="error" id="errorMsg">
    <div class="checkmark">!</div>
    <h2 data-i18n="errorTitle">Une erreur est survenue</h2>
    <p data-i18n="errorBody">Veuillez réessayer, ou nous contacter directement sur WhatsApp.</p>
  </div>
</div>

<script>
// ---------- i18n ----------
const TRANSLATIONS = {
  en: {
    title: "Start your journey to Malaysia",
    subtitle: "In 30 seconds",
    fullName: 'Full Name <span class="required">*</span>',
    fullNamePh: "Enter your full name",
    phone: 'Phone Number <span class="required">*</span>',
    other: "🌍 Other",
    email: 'Email <span class="required">*</span>',
    nationality: 'Nationality <span class="required">*</span>',
    "Sénégal": "Senegal", "Côte d'Ivoire": "Ivory Coast", "Mali": "Mali", "Guinée": "Guinea",
    "Niger": "Niger", "Gabon": "Gabon", "Cameroun": "Cameroon", "Burkina Faso": "Burkina Faso",
    "Togo": "Togo", "Bénin": "Benin", "Maroc": "Morocco", "Algérie": "Algeria",
    "Tunisie": "Tunisia", "Kenya": "Kenya", "Émirats Arabes Unis": "United Arab Emirates",
    "Arabie Saoudite": "Saudi Arabia", "Qatar": "Qatar", "Koweït": "Kuwait", "Oman": "Oman",
    "Bahreïn": "Bahrain", "Jordanie": "Jordan", "Liban": "Lebanon", "Égypte": "Egypt",
    "Irak": "Iraq", "Yémen": "Yemen", "Autre": "Other",
    school: 'Current school <span class="required">*</span>',
    schoolPh: "High school or university — e.g. Lycée Seydina Limamoulaye, UCAD...",
    level: 'Desired Level of Study in Malaysia <span class="required">*</span>',
    "Foundation (Prépa)": "Foundation", "PhD (Doctorat)": "PhD",
    program: 'Desired Program <span class="required">*</span>',
    programPh: "E.g. Computer Science, Business, Medicine...",
    intake: 'Desired Intake <span class="required">*</span>',
    "January": "January", "February": "February", "March": "March", "April": "April",
    "May": "May", "June": "June", "July": "July", "August": "August",
    "September": "September", "October": "October", "November": "November", "December": "December",
    source: 'How did you hear about us? <span class="required">*</span>',
    "Referral": "Referral", "Social Media": "Social Media", "Website": "Website",
    ref: "Referral Code",
    refPh: "If applicable",
    submit: "Submit",
    thanks: "Thank you!",
    thanksBody: "Our team will contact you on WhatsApp or by phone within 24 hours.",
    errorTitle: "Something went wrong",
    errorBody: "Please try again, or contact us directly on WhatsApp.",
    toggleTo: "Français"
  },
  fr: { toggleTo: "English" }
};

function applyLang(lang) {
  const dict = TRANSLATIONS[lang] || {};
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key]) el.innerHTML = dict[key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (dict[key]) el.setAttribute('placeholder', dict[key]);
  });
  document.documentElement.lang = lang;

  const toggle = document.getElementById('langToggle');
  const params = new URLSearchParams(window.location.search);
  const other = lang === 'en' ? 'fr' : 'en';
  toggle.textContent = (TRANSLATIONS[lang] && TRANSLATIONS[lang].toggleTo) || (other === 'en' ? 'English' : 'Français');
  toggle.onclick = (e) => {
    e.preventDefault();
    params.set('lang', other);
    window.location.search = params.toString();
  };
}

const currentLang = new URLSearchParams(window.location.search).get('lang') === 'en' ? 'en' : 'fr';
applyLang(currentLang);

// ---------- Submission (unchanged — same fields/values regardless of display language) ----------
document.getElementById('intakeForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = currentLang === 'en' ? 'Submitting...' : 'Envoi...';

  const form = e.target;
  const data = {
    fullName: form.fullName.value,
    phone: form.countryCode.value + ' ' + form.phone.value,
    email: form.email.value,
    nationality: form.nationality.value,
    school: form.school.value,
    level: form.level.value,
    program: form.program.value,
    intakePeriod: form.intakePeriod.value,
    intakeYear: form.intakeYear.value,
    source: form.source.value,
    // Manual referral code field, or auto-captured from URL (?ref=CODE) if present
    ref: form.ref.value || new URLSearchParams(window.location.search).get('ref') || ''
  };

  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    if (!res.ok) throw new Error('Submission failed');

    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
  } catch (err) {
    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('errorMsg').style.display = 'block';
  }
});
</script>

</body>
</html>
